name: Public feed check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node scripts/generate-feed.mjs
      - name: Verify XML, identities and subscription links
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as E, json
          a=json.load(open('data/articles.json'))
          expected={x['url'] for x in a['articles']+a['guides']}
          items=E.parse('feed.xml').getroot().findall('./channel/item')
          assert len(items)==len(expected)
          assert {i.findtext('guid') for i in items}==expected
          assert all(i.findtext('link')==i.findtext('guid') for i in items)
          for p in ['index.html','index_en.html']:
              t=open(p).read()
              assert 'type="application/rss+xml"' in t and 'href="feed.xml"' in t
          print('RSS XML and original links:', len(items))
          PY
